name: ESS 주간 뉴스 브리핑

on:
  schedule:
    # 정각(0분)은 GitHub 스케줄러가 가장 몰리는 시각이라 지연·유실이 잦다.
    # 애매한 분 값으로 옮기고 간격도 2시간으로 넓혀 동시에 씹힐 확률을 낮춘다.
    - cron: '13 22 * * 0'  # 매주 일요일 22:13 UTC = 월요일 07:13 KST (정기 실행)
    - cron: '13 0 * * 1'   # 2시간 후 안전망: 정기 실행 기록이 없으면 강제 실행
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 이번 주 정상 발송 여부 확인 (schedule 실행에서만)
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 날짜 문자열 비교는 스케줄이 지연되어 자정을 넘기면 같은 발송 주기를
          # 서로 다른 날로 인식해 중복 발송을 유발하므로, 자정 무관하게
          # "최근 20시간 이내 성공 실행 여부"로 판단한다 (두 트리거는 2시간 간격).
          CUTOFF=$(( $(date -u +%s) - 20*3600 ))
          RESPONSE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ess_briefing.yml/runs?per_page=10")
          ALREADY_SENT=$(echo "$RESPONSE" | jq -r --argjson current "${{ github.run_id }}" --argjson cutoff "$CUTOFF" '
            [.workflow_runs[] | select(.id != $current) | select((.created_at | fromdateiso8601) >= $cutoff) | select(.conclusion=="success")] | length > 0
          ')
          echo "최근 20시간 내 이미 성공한 실행 있음: $ALREADY_SENT"
          echo "already_sent=$ALREADY_SENT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.already_sent != 'true'
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt
        if: steps.check.outputs.already_sent != 'true'

      - name: config.json 생성
        if: steps.check.outputs.already_sent != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python -c "
          import json, os
          config = {
            'anthropic_api_key': os.environ['ANTHROPIC_API_KEY'],
            'email': {
              'smtp_host': 'smtp.gmail.com',
              'smtp_port': 587,
              'sender': os.environ['EMAIL_SENDER'],
              'password': os.environ['EMAIL_PASSWORD'],
              'recipient': [
                'kjs5075.kim@samsung.com',
                'woochoul@samsung.com',
                'jeawon.seo@samsung.com',
                'daae63.kim@samsung.com',
                'jp.eom@samsung.com'
              ]
            }
          }
          open('config.json','w').write(json.dumps(config))
          "

      - run: python ess_briefing.py
        if: steps.check.outputs.already_sent != 'true'
